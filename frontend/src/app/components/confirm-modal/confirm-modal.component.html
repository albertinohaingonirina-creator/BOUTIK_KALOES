<div *ngIf="isOpen" 
     class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center p-3" 
     style="background-color: rgba(28, 19, 14, 0.55); backdrop-filter: blur(8px); z-index: 100000;">
  
  <div class="card border-0 rounded-4 shadow-lg text-center overflow-hidden bg-white mx-auto" 
       style="width: 100%; max-width: 400px; border: 1px solid #E6E1DA;">
    
    <div class="p-4 pt-5 pb-4">
      <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center mb-3 shadow-sm" 
           style="width: 68px; height: 68px; background-color: #F7F1E5; border: 1px solid #C5A059;">
        <i class="bi bi-shield-exclamation fs-2" style="color: #C5A059;"></i>
      </div>
      
      <h5 class="fw-bold mb-2" style="color: #1C130E; font-family: 'Playfair Display', serif; font-size: 1.25rem;">{{ data.titre }}</h5>
      <p class="small text-muted mb-0 px-3" style="line-height: 1.6;">{{ data.message }}</p>
    </div>

    <div class="px-4 py-3 d-flex justify-content-end gap-2 border-top" style="background-color: #F8F6F2; border-color: #E6E1DA;">
      <button type="button" 
              class="btn btn-sm rounded-pill px-4 py-2 fw-semibold text-secondary border-0 bg-transparent" 
              (click)="cancel()">
        Annuler
      </button>
      <button type="button" 
              class="btn btn-sm rounded-pill px-4 py-2 fw-bold text-white shadow-sm" 
              style="background-color: #B86538; border: none;" 
              (click)="confirm()">
        {{ data.boutonTexte || 'Confirmer' }}
      </button>
    </div>

  </div>
</div>
