<div *ngIf="isOpen" 
     class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center p-3" 
     style="background-color: rgba(31, 20, 14, 0.55); backdrop-filter: blur(6px); z-index: 100000;">
  
  <div class="card border-0 rounded-4 shadow-2xl text-center overflow-hidden bg-white mx-auto" 
       style="width: 100%; max-width: 380px; border: 1px solid #EFEBE9;">
    
    <div class="p-4 pt-5 pb-4">
      <div class="rounded-circle mx-auto d-flex align-items-center justify-content-center mb-3 shadow-sm" 
           style="width: 64px; height: 64px; background-color: #FBE9E7; border: 1px solid #FFCCBC;">
        <i class="bi bi-exclamation-triangle-fill fs-2" style="color: #D84315;"></i>
      </div>
      
      <h5 class="fw-bold mb-2" style="color: #2B1A12; font-family: serif;">{{ data.titre }}</h5>
      <p class="small text-muted mb-0 px-2" style="line-height: 1.5;">{{ data.message }}</p>
    </div>

    <div class="px-4 py-3 d-flex justify-content-end gap-2 border-top" style="background-color: #FAF7F2; border-color: #EFEBE9;">
      <button type="button" 
              class="btn btn-sm rounded-pill px-4 py-2 fw-semibold text-secondary border-0 bg-transparent" 
              (click)="cancel()">
        Annuler
      </button>
      <button type="button" 
              class="btn btn-sm rounded-pill px-4 py-2 fw-bold text-white shadow-sm" 
              style="background-color: #D84315; border-color: #D84315;" 
              (click)="confirm()">
        {{ data.boutonTexte || 'Confirmer' }}
      </button>
    </div>

  </div>
</div>
