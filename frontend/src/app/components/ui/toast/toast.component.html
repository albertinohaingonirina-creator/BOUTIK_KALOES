<div class="position-fixed d-flex flex-column gap-2" style="top: 24px; right: 24px; z-index: 105000; width: 100%; max-width: 380px; pointer-events: none;">
  <div *ngFor="let toast of toasts" 
       class="kaloes-luxury-toast p-3 rounded-4 position-relative overflow-hidden shadow-lg border"
       style="pointer-events: auto; background-color: rgba(250, 247, 242, 0.98); backdrop-filter: blur(14px); border-color: #C5A059 !important; box-shadow: 0 12px 36px rgba(24, 17, 13, 0.16) !important;">
    
    <div class="d-flex align-items-start gap-3">
      <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
           [style.background-color]="toast.type === 'error' ? '#FDF4F0' : '#F7F1E5'"
           [style.border]="toast.type === 'error' ? '1px solid #B86538' : '1px solid #C5A059'"
           style="width: 38px; height: 38px;">
        <span *ngIf="toast.type === 'success'" style="color: #C5A059; font-size: 1.1rem; font-weight: bold;">✓</span>
        <i *ngIf="toast.type === 'error'" class="bi bi-exclamation-circle-fill" style="color: #B86538; font-size: 1rem;"></i>
        <i *ngIf="toast.type === 'warning'" class="bi bi-exclamation-triangle-fill" style="color: #B86538; font-size: 1rem;"></i>
        <i *ngIf="toast.type === 'info'" class="bi bi-info-circle-fill" style="color: #C5A059; font-size: 1rem;"></i>
      </div>

      <div class="flex-grow-1 overflow-hidden pe-2">
        <h6 class="fw-bold mb-1 text-truncate" style="color: #1C130E; font-family: 'Playfair Display', serif; font-size: 0.95rem;">
          {{ toast.title || 'Maison Kaloès' }}
        </h6>
        <p class="mb-0 small" style="color: #2C221E; font-size: 0.82rem; line-height: 1.45; word-break: break-word;">
          {{ toast.message }}
        </p>
      </div>

      <button type="button" 
              class="btn btn-sm p-1 text-muted border-0 shadow-none d-flex align-items-center justify-content-center rounded-circle flex-shrink-0" 
              style="width: 26px; height: 26px; background-color: rgba(28, 19, 14, 0.06);"
              aria-label="Fermer" 
              (click)="close(toast.id)">
        <i class="bi bi-x" style="font-size: 1.2rem; color: #1C130E;"></i>
      </button>
    </div>

    <div class="toast-progress-bar position-absolute bottom-0 start-0 w-100" 
         [style.background-color]="toast.type === 'error' ? '#B86538' : '#C5A059'" 
         style="height: 3px;">
    </div>
  </div>
</div>
