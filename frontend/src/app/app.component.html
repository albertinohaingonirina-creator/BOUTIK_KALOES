<div class="kaloes-top-loader" [style.width.%]="loadingService.progress$ | async"></div>

<div *ngIf="loadingService.isLoading$ | async" 
     class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center" 
     style="background-color: rgba(24, 17, 13, 0.6); backdrop-filter: blur(8px); z-index: 99990;">
  
  <div class="p-4 rounded-4 text-center shadow-lg bg-white border d-flex flex-column align-items-center" 
       style="width: 260px; border-color: #E6E1DA;">
    
    <div class="position-relative d-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
      <div class="spinner-border" style="color: #C5A059; width: 48px; height: 48px; border-width: 3px;" role="status"></div>
      <img src="assets/logoKaloes.png" alt="Kaloès" class="position-absolute" style="max-height: 28px; width: auto; object-fit: contain;">
    </div>

    <h6 class="fw-bold mb-1" style="color: #1C130E; font-family: 'Playfair Display', serif; font-size: 1rem;">Maison Kaloès</h6>
    <span class="text-muted" style="font-size: 0.72rem; letter-spacing: 0.1em;">SYNCHRONISATION</span>
  </div>
</div>

<app-toast></app-toast>

<router-outlet></router-outlet>

<app-confirm-modal></app-confirm-modal>
